<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subtitle Editor</title>
<link rel="stylesheet" href="/static/style.css?v=18">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════ TOOLBAR -->
<header id="toolbar">
  <div class="toolbar-left">
    <span class="app-title">Subtitle Editor</span>
    <span id="timing-badge" class="timing-badge badge-srt">SRT-timed</span>
  </div>

  <div class="toolbar-center">
    <button id="btn-browse" class="btn-ghost">Open SRT…</button>
    <span id="file-name-display" class="file-name-display">No file loaded</span>
    <button id="btn-save" class="btn-ghost" disabled>Download SRT</button>
    <button id="btn-export-word-srt" class="btn-ghost" disabled title="Export word-level SRT for Resolve live mode">Export word SRT</button>
    <button id="btn-save-as" class="btn-ghost" disabled>Save to path…</button>
  </div>

  <div class="toolbar-right">
    <div id="resolve-pill" class="pill pill-idle" title="Click to connect">
      <span class="pill-dot"></span>
      <span id="resolve-label">DaVinci Resolve</span>
    </div>
  </div>
</header>

<!-- ═══════════════════════════════════════════════════════════ SETTINGS BAR -->
<div id="settings-bar">
  <label class="setting-group">
    <span>Max chars / line</span>
    <input id="max-chars" type="number" min="10" max="120" value="42">
  </label>

  <label class="setting-group">
    <span>Long-line mode</span>
    <select id="format-mode">
      <option value="two_line">Wrap to 2 lines (same cue)</option>
      <option value="split">Split into separate cues</option>
    </select>
  </label>

  <button id="btn-auto-format" class="btn-secondary" disabled>Auto-format all</button>

  <div class="setting-sep"></div>

  <button id="btn-read-resolve" class="btn-ghost" disabled title="Load subtitles from the active Resolve timeline">
    ↓ Read from Resolve
  </button>
  <button id="btn-push-resolve" class="btn-ghost" disabled title="Save a new versioned SRT for Resolve import">
    💾 Save new version
  </button>
</div>

<!-- ═══════════════════════════════════════════════════════════ TRANSCRIBE BAR -->
<div id="transcribe-bar">
  <label class="setting-group">
    <span>Transcribe</span>
    <input id="transcribe-path" type="text" placeholder="Path to audio or video file…" spellcheck="false" class="transcribe-input">
  </label>
  <button id="btn-browse-media" class="btn-ghost btn-sm" title="Browse for audio/video file">📂</button>
  <button id="btn-transcribe" class="btn-primary">Transcribe</button>
  <div id="transcribe-progress" class="progress-bar hidden">
    <div id="transcribe-progress-fill" class="progress-fill"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════ MAIN -->
<main id="cue-list-container">
  <div id="empty-state">
    <p>Paste a video or audio file path above and click <strong>Transcribe</strong> to get started.</p>
    <p class="hint">The SRT will be saved automatically next to your source file.</p>
    <p class="hint" style="margin-top:4px">Or click <strong>Open SRT…</strong> to load an existing subtitle file.</p>
  </div>
  <!-- script-view is created dynamically by app.js -->
</main>

<!-- ═══════════════════════════════════════════════════════════ STATUS BAR -->
<footer id="status-bar">
  <span id="status-msg">Ready.</span>
  <span id="cue-count"></span>
</footer>

<!-- ═══════════════════════════════════════════════════════════ SAVE-AS MODAL -->
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <h3>Save As</h3>
    <input id="save-as-input" type="text" placeholder="Full path, e.g. C:\Videos\my_subs.srt" spellcheck="false">
    <div class="modal-actions">
      <button id="btn-modal-cancel" class="btn-ghost">Cancel</button>
      <button id="btn-modal-save" class="btn-primary">Save</button>
    </div>
  </div>
</div>

<script src="/static/app.js?v=18"></script>
</body>
</html>
